name: onyxfi_frontend
description: "OnyxFi — Agentic Personal Finance & Wealth Simulator"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # AI — Gemini API Integration
  google_generative_ai: ^0.4.6

  # Generative UI SDK (official flutter/genui — labs.flutter.dev)
  # genui_dartantic is intentionally excluded — it is deprecated/deactivated.
  genui: ^0.8.0
  json_schema_builder: ^0.1.3

  # Data Visualization
  fl_chart: ^0.70.2

  # Environment Variables
  flutter_dotenv: ^5.2.1

  # State Management
  provider: ^6.1.2

  # Typography — Inter font from Google Fonts
  google_fonts: ^6.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
